global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'kong'
    static_configs:
      - targets: ['kong-proxy:8001']
    metrics_path: /metrics

  - job_name: 'authservice'
    static_configs:
      - targets: ['authservice:8080']
    metrics_path: /metrics

  - job_name: 'kitchen-service'
    static_configs:
      - targets: ['kitchen-service:8080']
    metrics_path: /metrics

  - job_name: 'manager-menu-service'
    static_configs:
      - targets: ['manager-menu-service:8080']
    metrics_path: /metrics

  - job_name: 'menu-service'
    static_configs:
      - targets: ['menu-service:8080']
    metrics_path: /metrics

  - job_name: 'orderservice'
    static_configs:
      - targets: ['orderservice:8080']
    metrics_path: /metrics
